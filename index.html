<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Viewshed Analysis</title>
    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }

      #paneDiv {
        padding: 10px 14px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        font-size: 13px;
        line-height: 1.4;
        border-radius: 4px;
        max-width: 220px;
      }

      @media (max-width: 600px) {
        #paneDiv {
          font-size: 12px;
          max-width: 160px;
          padding: 8px 10px;
        }
      }
    </style>

    <link rel="stylesheet" href="https://js.arcgis.com/4.25/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.25/"></script>

    <script>
      require([
        "esri/Map",
        "esri/views/SceneView",
        "esri/layers/GraphicsLayer",
        "esri/Graphic",
        "esri/geometry/Point",
        "esri/rest/geoprocessor",
        "esri/rest/support/LinearUnit",
        "esri/rest/support/FeatureSet",
        "esri/widgets/Search"
      ], (Map, SceneView, GraphicsLayer, Graphic, Point, geoprocessor, LinearUnit, FeatureSet, Search) => {
        const gpUrl =
          "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Elevation/ESRI_Elevation_World/GPServer/Viewshed";

        const map = new Map({
          basemap: "hybrid",
          ground: "world-elevation"
        });

        const view = new SceneView({
          container: "viewDiv",
          map: map,
          camera: {
            position: [7.59564, 46.06595, 5184],
            tilt: 70
          }
        });

        const graphicsLayer = new GraphicsLayer();
        map.add(graphicsLayer);

        const markerSymbol = {
          type: "simple-marker",
          color: [255, 0, 0],
          outline: {
            color: [255, 255, 255],
            width: 2
          }
        };

        const fillSymbol = {
          type: "simple-fill",
          color: [226, 119, 40, 0.75],
          outline: {
            color: [255, 255, 255],
            width: 1
          }
        };

        const options = {
          outSpatialReference: {
            wkid: 102100
          }
        };

        view.on("click", computeViewshed);

        function computeViewshed(event) {
          graphicsLayer.removeAll();

          const point = new Point({
            longitude: event.mapPoint.longitude,
            latitude: event.mapPoint.latitude
          });

          const inputGraphic = new Graphic({
            geometry: point,
            symbol: markerSymbol
          });

          graphicsLayer.add(inputGraphic);

          const inputGraphicContainer = [];
          inputGraphicContainer.push(inputGraphic);
          const featureSet = new FeatureSet();
          featureSet.features = inputGraphicContainer;

          const vsDistance = new LinearUnit();
          vsDistance.distance = 40;
          vsDistance.units = "miles";

          const params = {
            Input_Observation_Point: featureSet,
            Viewshed_Distance: vsDistance
          };

          geoprocessor.execute(gpUrl, params, options).then(drawResultData);
        }

        function drawResultData(result) {
          const resultFeatures = result.results[0].value.features;

          const viewshedGraphics = resultFeatures.map((feature) => {
            feature.symbol = fillSymbol;
            return feature;
          });

          graphicsLayer.addMany(viewshedGraphics);

          view.goTo({
            target: viewshedGraphics,
            tilt: 0
          })
          .catch((error) => {
            if (error.name != "AbortError") {
              console.error(error);
            }
          });
        }

        const searchWidget = new Search({
          view: view
        });

        view.ui.add(searchWidget, {
          position: "top-left",
          index: 0
        });

        view.ui.add("paneDiv", "top-right");
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
    <div id="paneDiv" class="esri-widget">
      Click on the map to run a viewshed analysis.<br />
      Use the search bar to find a location by address, city, zip code, or coordinates.
    </div>
  </body>
</html>
